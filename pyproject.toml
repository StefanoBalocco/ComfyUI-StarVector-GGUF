requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
dependencies = ["gguf>=0.13.0", "tokenizers>=0.19", "Pillow>=9.0", "numpy>=1.24", "beautifulsoup4>=4.12", "lxml>=4.9", "cairosvg>=2.7", "vtracer>=0.6", "scipy"]
